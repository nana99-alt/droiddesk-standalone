plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace 'com.droiddesk.linux'
  defaultConfig {
    minSdkVersion 26
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'org.apache.commons:commons-compress:1.27.1'
}
