name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a public v1.0.0 GitHub Release after the APK builds
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android-debug:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-36,build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Android-debug-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.0.0 GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk \
            --title 'DroidDesk v1.0.0 (debug-signed)' \
            --notes 'Installable ARM64 debug-signed APK built by GitHub Actions. This is not a production-signing key; future updates may require uninstalling the previous build first.'
